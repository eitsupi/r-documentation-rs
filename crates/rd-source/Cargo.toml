[package]
name = "rd-source"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Parser for R documentation source files into rd-ast documents"
readme = "README.md"
keywords = ["r", "rstats", "rd", "documentation", "parser"]
categories = ["parsing", "text-processing"]
exclude = ["tests/fixtures/generate.R"]

[dependencies]
rd-ast = { workspace = true }

[dev-dependencies]
rd-ast = { workspace = true, features = ["rds"] }
# `gzip` is explicit because the workspace edge disables rd-rds defaults and
# the differential corpus reads a gzip-compressed R-generated `.rds` fixture.
rd-rds = { workspace = true, features = ["gzip"] }
serde = { version = "1", features = ["derive"] }
toml = "1"
