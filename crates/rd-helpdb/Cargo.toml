[package]
name = "rd-helpdb"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Reader for installed R package help databases (aliases, .rdx/.rdb, Meta/hsearch.rds), built on rd-rds"
readme = "README.md"
keywords = ["r", "rstats", "documentation", "help", "database"]
categories = ["database", "parsing"]

[dependencies]
rd-rds = { workspace = true, features = ["lazyload"] }
thiserror.workspace = true

[features]
default = ["gzip", "xz", "bzip2", "zstd"]
# These forward to rd-rds and control only the additional compression
# envelopes accepted for standalone `.rds` files. The mandatory `lazyload`
# feature includes gzip for normal installed-package `.rdx` files; raw zlib
# `.rdb` records are decoded by rd-rds as part of that feature.
gzip = ["rd-rds/gzip"]
xz = ["rd-rds/xz"]
bzip2 = ["rd-rds/bzip2"]
zstd = ["rd-rds/zstd"]

[dev-dependencies]
rd-ast = { workspace = true, features = ["rds"] }
