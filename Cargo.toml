[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.3.1"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/eitsupi/r-documentation-rs"

[workspace.dependencies]
thiserror = "2"
# Defaults off so members opt into codecs explicitly; leaving them on here is
# what made downstream unable to escape xz (see CHANGELOG 0.3.1).
rd-ast = { version = "0.3.1", path = "crates/rd-ast", default-features = false }
rd-rds = { version = "0.3.1", path = "crates/rd-rds", default-features = false }
rd-source = { version = "0.3.1", path = "crates/rd-source" }
rd-writer = { version = "0.3.1", path = "crates/rd-writer" }
flate2 = "1"
xz2 = "0.1"
bzip2 = "0.6"
ruzstd = "0.9.0"
